name: PR Verify

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: PR Verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests with Vitest
        id: run-tests
        run: npm run test:run
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.run-tests.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';

            let comment = `## ${icon} Test Results\n\n`;
            comment += `**Status:** ${outcome === 'success' ? 'Passed' : 'Failed'}\n`;
            comment += `**Runner:** Vitest\n`;
            comment += `**Node Version:** ${{ matrix.node-version }}\n\n`;

            // Try to read coverage summary if available
            try {
              const coverageExists = fs.existsSync('coverage/coverage-summary.json');
              if (coverageExists) {
                const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
                const total = coverage.total;

                comment += '### 📊 Coverage Summary\n\n';
                comment += '| Metric | Coverage | Status |\n';
                comment += '|--------|----------|--------|\n';
                comment += `| Statements | ${total.statements.pct}% | ${total.statements.pct >= 80 ? '🟢' : total.statements.pct >= 60 ? '🟡' : '🔴'} |\n`;
                comment += `| Branches | ${total.branches.pct}% | ${total.branches.pct >= 80 ? '🟢' : total.branches.pct >= 60 ? '🟡' : '🔴'} |\n`;
                comment += `| Functions | ${total.functions.pct}% | ${total.functions.pct >= 80 ? '🟢' : total.functions.pct >= 60 ? '🟡' : '🔴'} |\n`;
                comment += `| Lines | ${total.lines.pct}% | ${total.lines.pct >= 80 ? '🟢' : total.lines.pct >= 60 ? '🟡' : '🔴'} |\n`;
              }
            } catch (e) {
              comment += '\n_Coverage report not available_\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
