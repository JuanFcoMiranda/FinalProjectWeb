version: '3.8'

services:
  # Servicio de desarrollo con hot-reload
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: proyectofinal-web-dev
    # Ejecutar como usuario no privilegiado (coincide con el Dockerfile)
    user: "1001:1001"
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src
      - ./angular.json:/app/angular.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
    environment:
      - API_URL=http://finalproject:8080/api
      - CHOKIDAR_USEPOLLING=true
    networks:
      - finalproject-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  # Usa la red existente del contenedor finalproject
  finalproject-network:
    external: true
